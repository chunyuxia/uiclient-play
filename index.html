<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>UI Client Stream</title>
<style>
  :root { --bg: #111; --fg: #ddd; --panel: #1c1c1c; --ok: #4caf50; --bad: #e57373; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
  /* the stage keeps the game's own resolution and is scaled as a whole, so UI and video stay aligned */
  #fit { position: relative; width: 100%; max-width: 1280px; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #000; }
  #stage video { position: absolute; left: 0; top: 0; }
  /* the mirror client never receives input itself: a transparent layer on top captures it for the game */
  #stage canvas { position: absolute; left: 0; top: 0; background: transparent; pointer-events: none; }
  #input { position: absolute; inset: 0; outline: none; cursor: default; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* connection state over the picture (connecting, reconnecting) */
  #status { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5;
            background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 18px; pointer-events: none; text-align: center; padding: 16px; }
  /* on-screen keys for keyboard games on touch devices, over the picture's lower corners */
  #touchkeys { position: absolute; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end;
               padding: 10px; pointer-events: none; z-index: 4; }
  #touchkeys button { pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; border: 0;
                      background: rgba(255, 255, 255, 0.22); color: #fff; font: 600 16px system-ui, sans-serif; border-radius: 12px; }
  #touchkeys button.on { background: rgba(255, 255, 255, 0.5); }
  #touchkeys .pad { display: grid; grid-template: "a u b" 56px "l c r" 56px "x d y" 56px / 56px 56px 56px; gap: 4px; }
  #touchkeys .pad .u { grid-area: u; } #touchkeys .pad .l { grid-area: l; } #touchkeys .pad .r { grid-area: r; } #touchkeys .pad .d { grid-area: d; }
  #touchkeys .keys { display: flex; flex-direction: column; gap: 8px; }
  #touchkeys .keys button { min-width: 72px; height: 52px; padding: 0 12px; }
  #fit:fullscreen { max-width: none; background: #000; display: flex; align-items: center; justify-content: center; }
  #input:focus { box-shadow: inset 0 0 0 2px rgba(80, 160, 255, 0.5); }
  #panel { width: 100%; max-width: 1280px; background: var(--panel); padding: 8px 10px; box-sizing: border-box;
           display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 4px 16px; }
  #panel b { color: #fff; font-weight: 600; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  /* view toggle: what the viewer sees (input always goes to the game) */
  #view { display: flex; gap: 0; border: 1px solid #444; border-radius: 6px; overflow: hidden; }
  #view button { background: var(--panel); color: var(--fg); border: 0; padding: 6px 14px; font: inherit; cursor: pointer; }
  #view button + button { border-left: 1px solid #444; }
  #view button[aria-pressed="true"] { background: #2f5d8a; color: #fff; }
  #fs { margin-left: 8px; }
  #view-note { color: #999; font-size: 12px; text-align: center; max-width: 1280px; }
  #log { width: 100%; max-width: 1280px; height: 110px; overflow: auto; background: var(--panel); white-space: pre-wrap;
         font: 11px/1.35 ui-monospace, monospace; padding: 6px 10px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="wrap">
  <div id="fit"><div id="stage"><video id="video" playsinline muted autoplay></video><canvas id="unity"></canvas><div id="input" tabindex="0"></div></div>
    <div id="touchkeys"></div><div id="status">Loading...</div></div>
  <div id="view" role="group" aria-label="View">
    <button data-view="full" aria-pressed="true">Full (world + UI)</button>
    <button data-view="world">World only (cloud video)</button>
    <button data-view="ui">UI only (local client)</button>
    <button id="fs" title="Full screen">&#x26F6; Full screen</button>
  </div>
  <div id="view-note"></div>
  <div id="panel"></div>
  <div id="log"></div>
</div>
<script src="web/player.js?v=aea99806a8"></script>
</body>
</html>
